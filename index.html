<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .loader { text-align: center; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 16px;
            border: 4px solid rgba(128,128,128,0.3);
            border-top-color: var(--tg-theme-button-color, #2481cc);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div>Загрузка...</div>
    </div>

    <script>
        // ==== НАСТРОЙКА ====
        // Укажите здесь адрес вашего основного сайта
        const TARGET_URL = 'https://xgod.club/?ref=YiuDNj&utm';

        // Фиксированные UTM-метки (всегда одинаковые)
        const FIXED_PARAMS = {
            utm_source: 'tg',
            utm_medium: 'bot',
            utm_campaign: 'mini-app'
        };

        // Куда положить значение startapp из Telegram
        const UTM_KEY = 'utm_content';

        // Значение по умолчанию, если метка не передана
        const DEFAULT_VALUE = 'none';
        // ===================

        (function () {
            const tg = window.Telegram?.WebApp;

            // 1. Инициализируем Mini App
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // 2. Получаем динамическую метку startapp
            let startParam = '';

            // Основной источник — из initDataUnsafe
            if (tg?.initDataUnsafe?.start_param) {
                startParam = tg.initDataUnsafe.start_param;
            }

            // Резервный — из GET-параметра tgWebAppStartParam
            if (!startParam) {
                const params = new URLSearchParams(window.location.search);
                startParam = params.get('tgWebAppStartParam') || '';
            }

            // 3. Если метки нет — подставляем значение по умолчанию
            if (!startParam) {
                startParam = DEFAULT_VALUE;
            }

            // 4. Собираем итоговый URL
            const targetUrl = new URL(TARGET_URL);

            // 4.1. Фиксированные метки
            for (const [key, value] of Object.entries(FIXED_PARAMS)) {
                targetUrl.searchParams.set(key, value);
            }

            // 4.2. Динамическая метка → в UTM_KEY (utm_content)
            targetUrl.searchParams.set(UTM_KEY, startParam);

            // 5. Редирект
            window.location.replace(targetUrl.toString());
        })();
    </script>
</body>
</html>
